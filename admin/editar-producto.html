<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editar producto - Administrador</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

  <!-- NAV ADMIN -->
  <header>
    <nav aria-label="Navegación administrador">
      <ul class="menu-admin">
        <li><a href="index.html">Home administrador</a></li>
        <li><a href="productos.html" aria-current="page" class="activo">Productos</a></li>
        <li><a href="usuarios.html">Usuarios</a></li>
      </ul>
    </nav>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="contenedor-admin">

    <h1>Editar producto (simulación)</h1>

    <section id="detalle-producto-admin" class="detalle-producto-admin detalle-edicion-simulada">
      <!-- admin-productos.js inserta aquí la tabla -->
    </section>

    <div class="acciones-superiores">
      <a href="productos.html" class="btn btn-primario">Volver al listado</a>
    </div>

    <p id="estado-admin" class="estado-admin"></p>

  </main>

  <!-- MODAL CONFIRMAR ELIMINACIÓN -->
  <div id="modal-confirmar" class="modal-admin">
    <div class="modal-contenido">
      <p>¿Seguro desea eliminar este producto?</p>
      <div class="modal-acciones">
        <button id="btn-confirmar-si" class="btn btn-primario">Sí, eliminar</button>
        <button id="btn-confirmar-no" class="btn btn-secundario">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- MODAL INGRESAR CLAVE -->
  <div id="modal-clave" class="modal-admin">
    <div class="modal-contenido">
      <p>Ingrese su clave de administrador</p>
      <input id="clave-admin" type="password" placeholder="Clave de administrador">
      <div class="modal-acciones">
        <button id="btn-clave-confirmar" class="btn btn-primario">Confirmar</button>
        <button id="btn-clave-cancelar" class="btn btn-secundario">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="pie-pagina">
    <p>© 2026 Pastelería Mil Sabores</p>
    <p><em>Más que postres: creamos momentos inolvidables en los que puedes confiar.</em></p>
  </footer>

  <!-- SCRIPTS -->
  <script src="../js/productos-data.js"></script>
  <script src="../js/validaciones.js"></script>

</body>
</html>
