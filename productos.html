<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Productos - Pastelería Mil Sabores</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <!-- Encabezado y navegación principal -->
  <header class="encabezado-principal">
    <a class="marca" href="index.html">Pastelería Mil Sabores</a>

    <nav aria-label="Navegación principal">
      <ul class="menu-principal">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html" aria-current="page">Productos</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="blogs.html">Blogs</a></li>
        <li><a href="contacto.html">Contacto</a></li>
        <li><a href="login.html">Iniciar sesión</a></li>
        <li><a href="registro.html">Crear Cuenta</a></li>
      </ul>
    </nav>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="contenedor">

    <!-- FILTROS -->
    <section class="filtros">
      <h1>Catálogo de productos</h1>

      <div class="filtro-categorias">
        <label for="categoria">Filtrar por categoría:</label>

        <select id="categoria">
          <option value="todas">Todas</option>
          <option value="Tortas Cuadradas">Tortas Cuadradas</option>
          <option value="Tortas Circulares">Tortas Circulares</option>
          <option value="Postres Individuales">Postres Individuales</option>
          <option value="Productos Sin Azúcar">Productos Sin Azúcar</option>
          <option value="Pastelería Tradicional">Pastelería Tradicional</option>
          <option value="Productos Sin Gluten">Productos Sin Gluten</option>
          <option value="Productos Veganos">Productos Veganos</option>
          <option value="Tortas Especiales">Tortas Especiales</option>
        </select>
      </div>
    </section>

    <!-- LISTA DE PRODUCTOS -->
    <section id="lista-productos" class="grid-productos">
      <!-- Render dinámico desde main.js -->
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="pie-pagina">
    <p>© 2026 Pastelería Mil Sabores</p>
    <p><em>Más que postres: creamos momentos inolvidables en los que puedes confiar.</em></p>
  </footer>

  <!-- SCRIPTS -->
  <script src="js/productos-data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
